name: Deploy to GitHub Pages

# main に push するたびに、検証 → テスト → ビルド → 公開 を自動で行う。
# 問題データや実装に不備があればここで止まり、壊れたものは公開されない。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 開発機（Node 24）に合わせる。
      # Node 20 では jsdom が使う undici が zstd 対応を要求して落ちる。
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 依存パッケージを入れる
        run: npm ci

      - name: 問題データを検証する
        run: npm run validate

      - name: 自動テスト
        run: npm test

      - name: ビルド
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
